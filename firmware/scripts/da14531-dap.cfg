source [find interface/cmsis-dap.cfg]

transport select swd
adapter speed 100

set CHIPNAME da14531
swd newdap $CHIPNAME cpu -expected-id 0x0bc11477
dap create $CHIPNAME.dap -chain-position $CHIPNAME.cpu
target create $CHIPNAME.cpu cortex_m -dap $CHIPNAME.dap

# Scratch for OpenOCD checksum code: above the 40 KiB application and the
# SDK programmer/buffer, below ROM data at 0x07FCB900. Restore original bytes.
$CHIPNAME.cpu configure -work-area-phys 0x07FCA000 -work-area-size 0x100 -work-area-backup 1

reset_config none

# Reset through AIRCR when nRESET is not connected. DA14531 latches the
# SYS_CTRL_REG RAM remap on a software reset, as in the SDK J-Link setup.
cortex_m reset_config sysresetreq
