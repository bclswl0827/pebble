[platformio]
default_envs = da14531_flash

[env]
platform = symlink://platforms/da14531
board = pebble_da14531
upload_protocol = cmsis-dap
custom_sdk_dir = platforms/da14531/vendor/DA145xx_SDK/6.0.24.1464
custom_swd_speed = 100
custom_flash_cs = 1
custom_flash_clk = 4
custom_flash_mosi = 0
custom_flash_miso = 3

[env:da14531_flash]
custom_upload_mode = flash

[env:da14531_sram]
custom_upload_mode = sram

; OTP is write-once. Any other value only checks the OTP and writes nothing.
[env:da14531_otp]
custom_upload_mode = otp
custom_otp_confirm = no
